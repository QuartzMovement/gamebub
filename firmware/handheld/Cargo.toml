[package]
name = "handheld"
version = "0.1.0"
authors = ["Eli Lipsitz <eli.lipsitz@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.71"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = ["std", "embassy", "esp-idf-svc/native"]

pio = ["esp-idf-svc/pio"]
std = [
    "alloc",
    "esp-idf-svc/binstart",
    "esp-idf-svc/std",
    "embedded-hal-bus/std",
]
alloc = ["esp-idf-svc/alloc"]
nightly = ["esp-idf-svc/nightly"]
experimental = ["esp-idf-svc/experimental"]
embassy = [
    "esp-idf-svc/embassy-sync",
    "esp-idf-svc/critical-section",
    "esp-idf-svc/embassy-time-driver",
]

[dependencies]
log = { version = "0.4", default-features = false }
esp-idf-svc = { version = "0.48", default-features = false }
anyhow = "1.0.79"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.1.0"
flate2 = "1.0.28"
thiserror = "1.0.57"
enum-map = "2.7.3"
slint = { version = "~1.7.2", default-features = false, features = [
    "compat-1-2",
    "unsafe-single-threaded",
    "libm",
    "renderer-software",
] }
serde = "1.0.197"
postcard = { version = "1.0.8", default-features = false, features = [
    "use-std",
] }
embedded-svc = "0.27.1"
smallvec = { version = "1.13.2", features = ["write"] }
time = "0.3.34"

[build-dependencies]
embuild = "0.31.3"
slint-build = "~1.7.2"
